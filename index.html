<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ग्रामपंचायत प्रशासन प्रणाली</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A1F44; --ink-2:#12305F; --amber:#F2A900; --paper:#EAEEF4; --card:#FFF;
  --rule:#C2CDDD; --rule-soft:#E1E7F0; --muted:#5A6B85; --muted-2:#7C8CA5;
  --ok:#0F7B4F; --warn:#8A5A00; --bad:#A8231C;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'IBM Plex Sans','Noto Sans Devanagari',system-ui,sans-serif;
  --dev:'Noto Sans Devanagari',sans-serif;
  --devserif:'Noto Serif Devanagari','Noto Sans Devanagari',serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
a{color:var(--ink-2)}

.seal{width:44px;height:44px;border-radius:50%;flex:none;border:2px solid var(--amber);display:grid;place-items:center;
  background:radial-gradient(circle at 50% 35%,rgba(242,169,0,.22),transparent 70%);position:relative}
.seal::after{content:'';position:absolute;inset:4px;border:1px solid rgba(242,169,0,.5);border-radius:50%}
.seal span{font-family:var(--devserif);font-weight:700;font-size:15px;color:var(--amber);line-height:1;z-index:1}

#gate{position:fixed;inset:0;z-index:100;background:linear-gradient(180deg,#0A1F44,#071634);
  display:grid;place-items:start center;padding:26px 18px;overflow-y:auto}
#gate .panel{width:100%;max-width:430px}
#gate .crest{display:flex;gap:14px;align-items:center;margin-bottom:20px}
#gate .crest .t1{font-family:var(--devserif);font-size:19px;font-weight:700;color:#fff;line-height:1.25}
#gate .crest .t2{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin-top:5px}
#gate .box{background:#fff;border-radius:8px;padding:20px;box-shadow:0 28px 60px -20px rgba(0,0,0,.6)}
.tabs{display:flex;border-bottom:1px solid var(--rule);margin:-20px -20px 18px;padding:0 6px;background:#F8FAFD;border-radius:8px 8px 0 0}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:12px 6px;cursor:pointer;
  font-family:var(--dev);font-size:13px;font-weight:600;color:var(--muted)}
.tab.on{color:var(--ink);border-bottom-color:var(--amber);background:#fff}
.tab small{display:block;font-family:var(--sans);font-size:10px;font-weight:400;color:var(--muted-2)}
#gate h2{margin:0 0 3px;font-family:var(--dev);font-size:15.5px;font-weight:600}
#gate .lede{margin:0 0 16px;font-size:12px;color:var(--muted)}
#gate footer{margin-top:16px;font-size:11px;color:#8FA2BE;text-align:center;line-height:1.6}
#gate footer b{color:var(--amber)}
.err{color:var(--bad);font-size:12px;min-height:17px;margin-top:7px}
.trialbadge{background:#FFF9EC;border:1px solid #E4D5AC;color:#6B5000;border-radius:5px;padding:9px 12px;font-size:12px;margin-bottom:15px}
.trialbadge b{font-family:var(--dev)}

.app{display:none;grid-template-columns:240px 1fr;min-height:100vh}
.app.on{display:grid}
.side{background:var(--ink);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.side .top{padding:15px;border-bottom:1px solid rgba(255,255,255,.13);display:flex;gap:11px;align-items:center}
.side .top .t1{font-family:var(--devserif);font-size:14.5px;font-weight:700;line-height:1.25}
.side .top .t2{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-top:4px}
.office{padding:11px 15px;border-bottom:1px solid rgba(255,255,255,.13);font-size:11.5px;color:#A9BAD2}
.office strong{display:block;font-family:var(--dev);font-size:13px;color:#fff;font-weight:600;margin-bottom:2px}
.office .fy{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--amber);margin-top:5px}
nav{flex:1;overflow-y:auto;padding:6px 0}
.navgroup{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:#6E82A2;padding:12px 15px 5px}
.navitem{display:grid;grid-template-columns:44px 1fr;align-items:center;width:100%;text-align:left;background:none;border:0;
  cursor:pointer;padding:7px 12px 7px 0;color:#C3D0E3;border-left:3px solid transparent}
.navitem:hover{background:rgba(255,255,255,.055);color:#fff}
.navitem.on{background:rgba(242,169,0,.13);border-left-color:var(--amber);color:#fff}
.namuna{font-family:var(--mono);font-size:8.5px;font-weight:600;text-align:center;color:var(--amber);opacity:.8}
.navitem.on .namuna{opacity:1}
.navlabel{font-family:var(--dev);font-size:13px;font-weight:500;line-height:1.25}
.navlabel span{display:block;font-family:var(--sans);font-size:10.5px;color:#8DA1BE;font-weight:400}
.navitem.on .navlabel span{color:#C3D0E3}
.side .bot{padding:10px 15px;border-top:1px solid rgba(255,255,255,.13);font-size:11px;color:#9BAECA}
.side .bot .who{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.side .bot .who i{width:26px;height:26px;border-radius:50%;background:var(--amber);color:#2A1D00;display:grid;place-items:center;
  font-style:normal;font-weight:700;font-size:11px;flex:none}
.side .bot .who b{display:block;color:#fff;font-family:var(--dev);font-size:12px;font-weight:600}
.linkbtn{background:none;border:0;color:#9BAECA;cursor:pointer;padding:0;font-size:11px;text-decoration:underline;text-underline-offset:2px}
.linkbtn:hover{color:#fff}

.topbar{background:#fff;border-bottom:1px solid var(--rule);padding:0 22px;min-height:46px;display:flex;align-items:center;
  justify-content:space-between;gap:16px;position:sticky;top:0;z-index:20}
.crumb{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2)}
.crumb b{color:var(--ink);font-weight:600}
.topmeta{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:flex;gap:14px;align-items:center}
.syncdot{display:inline-flex;align-items:center;gap:5px;font-size:10px}
.syncdot i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:block}
.syncdot.off i{background:var(--muted-2)}
.syncdot.err i{background:var(--bad)}

.ribbon{padding:8px 22px;font-size:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid}
.ribbon.trial{background:#FFF9EC;border-color:#E4D5AC;color:#6B5000}
.ribbon.warn{background:#FDF1EC;border-color:#E8C8B6;color:#7A3A12}
.ribbon.dead{background:#FDF3F2;border-color:#E6C6C3;color:#7A1A15}
.ribbon b{font-family:var(--dev)}
.ribbon .grow{margin-left:auto}

main{padding:0 22px 56px;max-width:1300px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 0 14px}
h1{font-family:var(--dev);font-size:20px;margin:0;font-weight:600;line-height:1.25}
h1 span{display:block;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:7px;flex-wrap:wrap}

.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:4px;padding:6.5px 13px;font-size:12.5px;
  font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
.btn:hover{background:var(--ink-2)}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{background:#F2F6FB;border-color:var(--ink)}
.btn.amber{background:var(--amber);border-color:#D69600;color:#2A1D00;font-weight:600}
.btn.amber:hover{filter:brightness(1.05)}
.btn.sm{padding:3.5px 8px;font-size:11.5px}
.btn.danger{background:#fff;color:var(--bad);border-color:#E3C2BF}
.btn.danger:hover{background:#FCF3F2}
.btn.wide{width:100%;padding:9px;text-align:center}
.btn:disabled{opacity:.42;cursor:not-allowed}

.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:11px}
.search{flex:1;min-width:180px;max-width:330px;padding:6.5px 11px;border:1px solid var(--rule);border-radius:4px;background:#fff}
select.filter{padding:6.5px 9px;border:1px solid var(--rule);border-radius:4px;background:#fff}
.count{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto}

.sheet{background:var(--card);border:1px solid var(--rule);border-radius:5px;overflow:hidden}
.sheethead{padding:9px 14px;border-bottom:1px solid var(--rule);background:#F4F7FB;display:flex;justify-content:space-between;
  align-items:center;gap:12px;flex-wrap:wrap}
.sheethead .t{font-family:var(--dev);font-size:13px;font-weight:600}
.sheethead .t em{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-left:9px}
.sheetwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:660px}
th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  font-weight:600;padding:8px 11px;background:#F8FAFD;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule-soft);white-space:nowrap}
th:last-child{border-right:0}
td{padding:8px 11px;border-bottom:1px solid var(--rule-soft);border-right:1px solid var(--rule-soft);vertical-align:top}
td:last-child{border-right:0}
tbody tr:nth-child(even){background:#FBFCFE}
tbody tr:hover{background:#F2F7FD}
tbody tr:last-child td{border-bottom:0}
tfoot td{background:#F4F7FB;border-top:2px solid var(--rule);font-weight:600;border-bottom:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.regno{font-family:var(--mono);font-weight:600;font-size:11.5px}
.mr{font-family:var(--dev)}
.sub{color:var(--muted);font-size:11.5px}
.right{text-align:right}
.rowacts{display:flex;gap:5px;white-space:nowrap}
.pill{display:inline-block;padding:1.5px 8px;border-radius:16px;font-size:10.5px;font-weight:600;border:1px solid;white-space:nowrap}
.p-open{color:var(--bad);border-color:#E6C6C3;background:#FDF4F3}
.p-prog{color:var(--warn);border-color:#E4D5AC;background:#FFFAEE}
.p-done{color:var(--ok);border-color:#BADCC9;background:#F1F9F5}
.p-neutral{color:var(--muted);border-color:var(--rule);background:#F5F8FC}
.empty{padding:46px 24px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--dev);font-size:14.5px;margin-bottom:5px;font-weight:600}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--rule);border-radius:5px;padding:12px 13px}
.stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat .k em{font-style:normal;font-family:var(--dev);letter-spacing:0;text-transform:none;font-size:11px;display:block;margin-top:1px}
.stat .v{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:6px}
.stat .n{font-size:11px;color:var(--muted);margin-top:1px}
.stat.accent{border-left:3px solid var(--amber)}
.bar{height:5px;background:var(--rule-soft);border-radius:3px;overflow:hidden;margin-top:6px;min-width:80px}
.bar i{display:block;height:100%;background:var(--amber)}
.bar.good i{background:var(--ok)}
.bar.bad i{background:var(--bad)}

.scrim{position:fixed;inset:0;background:rgba(7,22,52,.5);display:none;align-items:flex-start;justify-content:center;
  padding:26px 15px;z-index:60;overflow-y:auto}
.scrim.on{display:flex}
.modal{background:#fff;border-radius:7px;width:100%;max-width:680px;box-shadow:0 30px 70px -14px rgba(7,22,52,.55)}
.modal header{padding:14px 19px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;
  gap:12px;background:#F8FAFD;border-radius:7px 7px 0 0}
.modal header h2{margin:0;font-family:var(--dev);font-size:15.5px;font-weight:600}
.modal header .x{background:none;border:0;font-size:21px;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}
.modal .body{padding:17px 19px}
.modal footer{padding:13px 19px;border-top:1px solid var(--rule);display:flex;justify-content:flex-end;gap:7px;background:#F8FAFD;
  border-radius:0 0 7px 7px;flex-wrap:wrap}
.modal footer .spacer{margin-right:auto}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px 13px}
.field{display:flex;flex-direction:column;gap:3px}
.field.full{grid-column:1/-1}
label{font-family:var(--dev);font-size:12px;font-weight:600;color:var(--ink)}
label em{font-style:normal;font-family:var(--sans);font-weight:400;color:var(--muted);font-size:11px}
label .req{color:var(--bad);margin-left:2px}
input,select,textarea{padding:6.5px 10px;border:1px solid var(--rule);border-radius:4px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--ink)}
input.bad{border-color:var(--bad);background:#FEF8F8}
input:disabled,select:disabled,textarea:disabled{background:#F4F6FA;color:var(--muted)}
textarea{resize:vertical;min-height:62px}
.hint{font-size:11px;color:var(--muted)}
fieldset{border:1px solid var(--rule-soft);border-radius:5px;padding:12px 14px;margin:0 0 13px}
legend{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);padding:0 6px}
.notice{border-left:3px solid var(--amber);background:#FFFBF2;padding:10px 13px;border-radius:0 4px 4px 0;font-size:12px;
  color:#5C4A22;margin-top:13px;max-width:78ch}

#printArea{display:none}
.doc{font-family:'IBM Plex Sans','Noto Sans Devanagari',sans-serif;color:#000}
.doc .lh{text-align:center;border-bottom:2.5px solid #000;padding-bottom:11px;margin-bottom:6px;position:relative}
.doc .lh .l1{font-family:var(--devserif);font-size:20px;font-weight:700}
.doc .lh .l2{font-size:12.5px;margin-top:3px}
.doc .lh .l3{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;margin-top:6px;color:#333}
.doc .lh .pseal{position:absolute;left:0;top:0;width:52px;height:52px;border:2px solid #000;border-radius:50%;display:grid;
  place-items:center;font-family:var(--devserif);font-weight:700;font-size:16px}
.doc .meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:#444;border-bottom:1px solid #000;
  padding-bottom:5px;margin-bottom:16px}
.doc h3{text-align:center;font-family:var(--devserif);font-size:16px;margin:14px 0 5px;font-weight:700}
.doc h3 small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;font-weight:500;margin-top:4px;color:#333}
.doc .rule{height:1px;background:#000;width:130px;margin:0 auto 16px}
.doc table{width:100%;min-width:0;border-collapse:collapse;margin-bottom:12px}
.doc td,.doc th{border:1px solid #000;padding:6px 9px;font-size:12px;vertical-align:top}
.doc th{background:#e8e8e8;font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;text-align:left}
.doc td.k{width:35%;background:#f3f3f3;font-family:var(--dev);font-weight:600}
.doc .sign{display:flex;justify-content:space-between;align-items:flex-end;margin-top:56px;font-size:12px}
.doc .sign .box{text-align:center}
.doc .sign .sealbox{width:96px;height:96px;border:1px dashed #666;border-radius:50%;display:grid;place-items:center;font-size:9px;color:#777;margin:0 auto}
.doc .sign .line{border-top:1px solid #000;padding-top:5px;min-width:180px;font-family:var(--dev);font-weight:600}
.doc .sign .line small{display:block;font-family:var(--sans);font-weight:400;color:#444;font-size:10.5px}
.doc .foot{margin-top:24px;font-size:9.5px;color:#444;border-top:1px solid #999;padding-top:7px;display:flex;justify-content:space-between;gap:14px}
@media print{
  body{background:#fff}
  .app,#gate,.scrim,.splash{display:none!important}
  #printArea{display:block!important}
  @page{size:A4 portrait;margin:14mm}
  @page landscape{size:A4 landscape}
  .land{page:landscape}
}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);opacity:0;pointer-events:none;background:var(--ink);
  color:#fff;padding:9px 17px;border-radius:4px;font-size:12.5px;box-shadow:0 8px 26px -8px rgba(7,22,52,.6);transition:.18s;z-index:90;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--bad)}
.thumb{width:42px;height:42px;object-fit:cover;border-radius:3px;border:1px solid var(--rule);display:block;cursor:zoom-in}
.splash{position:fixed;inset:0;z-index:120;background:#0A1F44;color:#fff;display:grid;place-items:center;font-family:var(--dev);font-size:14px;padding:20px;text-align:center}

@media (max-width:900px){
  .app.on{grid-template-columns:1fr}
  .side{position:static;height:auto}
  nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;padding:6px}
  .navgroup{grid-column:1/-1;padding:8px 8px 2px}
  .navitem{border-left:0;border-bottom:3px solid transparent;padding:7px 5px}
  .navitem.on{border-left:0;border-bottom-color:var(--amber)}
  main{padding:0 13px 46px}
  .topbar{padding:7px 13px;flex-wrap:wrap;gap:6px}
  .ribbon{padding:8px 13px}
  .grid2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="splash" id="splash">प्रणाली सुरू होत आहे…</div>

<div id="gate" style="display:none">
  <div class="panel">
    <div class="crest">
      <div class="seal"><span>ग्रा</span></div>
      <div>
        <div class="t1">ग्रामपंचायत प्रशासन प्रणाली</div>
        <div class="t2">Panchayat Administration System</div>
      </div>
    </div>
    <div class="box">
      <div class="tabs">
        <button class="tab on" id="tabLogin" onclick="showTab('login')">प्रवेश<small>Sign in</small></button>
        <button class="tab" id="tabReg" onclick="showTab('reg')">नवीन नोंदणी<small>Register</small></button>
      </div>
      <div id="gateBody"></div>
      <div class="err" id="gateErr"></div>
    </div>
    <footer>
      <b>१५ दिवस मोफत चाचणी</b> — नोंदणी करा आणि लगेच वापरा.<br>
      15-day free trial · No card needed · ENTRIX Innovation, Nagpur
    </footer>
  </div>
</div>

<div class="app" id="app">
  <aside class="side">
    <div class="top">
      <div class="seal"><span>ग्रा</span></div>
      <div><div class="t1">ग्रामपंचायत</div><div class="t2">Admin System</div></div>
    </div>
    <div class="office" id="officeBox"></div>
    <nav id="nav"></nav>
    <div class="bot">
      <div class="who" id="whoBox"></div>
      <button class="linkbtn" onclick="logout()">बाहेर पडा · Sign out</button>
    </div>
  </aside>
  <div>
    <div class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="topmeta">
        <span class="syncdot" id="syncDot"><i></i><span id="syncTxt">Synced</span></span>
        <span id="tbDate"></span>
        <button class="btn ghost sm" onclick="openSettings()">Settings</button>
      </div>
    </div>
    <div id="ribbon"></div>
    <main>
      <div class="head"><h1 id="pageTitle"></h1><div class="actions" id="pageActions"></div></div>
      <div id="view"></div>
    </main>
  </div>
</div>

<div class="scrim" id="scrim" onclick="if(event.target===this)closeModal()">
  <div class="modal" role="dialog" aria-modal="true">
    <header><h2 id="modalTitle"></h2><button class="x" onclick="closeModal()" aria-label="Close">&times;</button></header>
    <div class="body" id="modalBody"></div>
    <footer id="modalFoot"></footer>
  </div>
</div>

function expiryDate(){ return TENANT && TENANT.expiresAt && TENANT.expiresAt.toDate ? TENANT.expiresAt.toDate() : null; }
function daysLeft(){ const e=expiryDate(); return e ? Math.ceil((e-new Date())/86400000) : 0; }
function licenceOk(){ return !!TENANT && ['trial','active'].indexOf(TENANT.status)>-1 && daysLeft()>0; }
const can=p=>!!USER && ROLES[USER.role].can.indexOf(p)>-1 && (p==='view'||licenceOk());

  if(!licenceOk()){ showExpired(); return false; }
  if(!can(p)){ toast('आपल्या पदाला ही कृती करता येत नाही.',true); return false; }
  return true;
}

/* ---------------- Firestore data layer ---------------- */
const gpRef=()=>fdb.collection('panchayats').doc(GPID);

async function loadAll(){
  DB=blankDB();
  setSync('off','Loading…');
  const snap=await gpRef().collection('data').get();
  snap.forEach(function(doc){
    const v=doc.data();
    if(doc.id==='meta') DB.seq=Object.assign(DB.seq,v.seq||{});
    else if(Array.isArray(v.rows)) DB[doc.id]=v.rows;
  });
  const cs=await gpRef().collection('complaints').orderBy('date','desc').limit(500).get();
  DB.complaints=cs.docs.map(d=>Object.assign({id:d.id},d.data()));
  const au=await gpRef().collection('audit').orderBy('ts','desc').limit(300).get();
  DB.audit=au.docs.map(d=>Object.assign({id:d.id},d.data()));
  setSync('','Synced');
}
async function saveModule(name){
  try{
    setSync('off','Saving…');
    if(name==='meta') await gpRef().collection('data').doc('meta').set({seq:DB.seq,updatedAt:FV.serverTimestamp()});
    else await gpRef().collection('data').doc(name).set({rows:DB[name],updatedAt:FV.serverTimestamp()});
    setSync('','Synced');
    return true;
  }catch(e){
    setSync('err','Not saved');
    if(e.code==='permission-denied'){ showExpired(); toast('मुदत संपल्याने नोंद जतन झाली नाही.',true); }
    else toast('जतन झाले नाही — '+(e.message||'error'),true);
    return false;
  }
}
async function saveComplaintDoc(rec){
  try{
    setSync('off','Saving…');
    const body=Object.assign({},rec); delete body.id;
    await gpRef().collection('complaints').doc(rec.id).set(body);
    setSync('','Synced'); return true;
  }catch(e){
    setSync('err','Not saved');
    if(e.code==='permission-denied'){ showExpired(); } else toast('जतन झाले नाही.',true);
    return false;
  }
}
async function logAudit(action,module,ref){
  const rec={ts:new Date().toISOString(),user:(USER&&USER.name)||'—',
    role:USER?ROLES[USER.role].mr:'—',action:action,module:module,ref:ref||''};
  DB.audit.unshift(Object.assign({id:uid()},rec));
  try{ await gpRef().collection('audit').add(rec); }catch(e){}
}

const emailFor=u=>u.toLowerCase().replace(/[^a-z0-9_.-]/g,'')+'@'+MAIL_DOMAIN;

async function doLogin(){
  const u=val('l_user'), p=$('#l_pass').value;
  if(!u||!p){ $('#gateErr').textContent='वापरकर्ता नाव व पासवर्ड भरा.'; return; }
  $('#gateErr').textContent='प्रवेश होत आहे…';
  try{ await auth.signInWithEmailAndPassword(emailFor(u),p); }
  catch(e){
    const badCred=['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'];
    $('#gateErr').textContent = badCred.indexOf(e.code)>-1
      ? 'चुकीचे वापरकर्ता नाव किंवा पासवर्ड · Incorrect username or password.'
      : 'प्रवेश अयशस्वी — '+(e.message||'');
  }
}

async function doRegister(){
  const name=val('r_name'), tal=val('r_tal'), dist=val('r_dist'), gs=val('r_gs'),
        mob=val('r_mob'), user=val('r_user'), pass=$('#r_pass').value,
        nw=Math.max(1,Math.min(30,Number(val('r_wards'))||5));
  const fail=(id,msg)=>{flagBad(id);$('#gateErr').textContent=msg;};
  if(!name) return fail('r_name','ग्रामपंचायतीचे नाव आवश्यक.');
  if(!tal)  return fail('r_tal','तालुका आवश्यक.');
  if(!dist) return fail('r_dist','जिल्हा आवश्यक.');
  if(!gs)   return fail('r_gs','ग्रामसेवकाचे नाव आवश्यक.');
  if(!/^\d{10}$/.test(mob)) return fail('r_mob','१० अंकी मोबाइल क्रमांक भरा.');
  if(!/^[a-zA-Z0-9_.-]{4,}$/.test(user)) return fail('r_user','वापरकर्ता नाव किमान ४ अक्षरे, इंग्रजीत, जागा नको.');
  if(pass.length<6) return fail('r_pass','पासवर्ड किमान ६ अक्षरे.');

  $('#gateErr').textContent='नोंदणी सुरू आहे…';
  let cred=null;
  REGISTERING=true;
  try{
    cred=await auth.createUserWithEmailAndPassword(emailFor(user),pass);
    const newUid=cred.user.uid;
    const gpId=(dist.slice(0,2)+tal.slice(0,2)).replace(/\s/g,'')+'-'+Date.now().toString(36).slice(-6).toUpperCase();
    const exp=new Date(Date.now()+TRIAL_DAYS*86400000);
    const wardsArr=[]; for(let i=1;i<=nw;i++) wardsArr.push(String(i));

    await fdb.collection('panchayats').doc(gpId).set({
      name:name,taluka:tal,district:dist,state:'महाराष्ट्र',
      sarpanch:val('r_sar'),gramsevak:gs,mobile:mob,
      wards:wardsArr,fy:'2026-27',code:'',
      ownerUid:newUid,plan:'trial',status:'trial',
      expiresAt:firebase.firestore.Timestamp.fromDate(exp),
      createdAt:FV.serverTimestamp()
    });
    await fdb.collection('users').doc(newUid).set({
      gpId:gpId,role:'gramsevak',name:gs,username:user,active:true,createdAt:FV.serverTimestamp()
    });
    REGISTERING=false;
    toast('नोंदणी पूर्ण — '+TRIAL_DAYS+' दिवसांची चाचणी सुरू.');
    await enterOffice(cred.user);       // records exist now, so open the office
  }catch(e){
    REGISTERING=false;
    if(cred){ try{ await cred.user.delete(); }catch(_){} }
    $('#gateErr').textContent = e.code==='auth/email-already-in-use'
      ? 'हे वापरकर्ता नाव आधीच वापरात आहे. दुसरे निवडा.'
      : 'नोंदणी अयशस्वी — '+(e.message||'');
  }
}

/* ---------------- Auth lifecycle ---------------- */
auth.onAuthStateChanged(async function(u){
  if(REGISTERING) return;              // doRegister opens the office itself
  if(!u){
    USER=null;TENANT=null;GPID=null;
    $('#app').classList.remove('on'); $('#splash').style.display='none';
    $('#gate').style.display='grid'; showTab('login'); return;
  }
  await enterOffice(u);
});
async function enterOffice(u){
  try{
    $('#splash').style.display='grid'; $('#splash').textContent='माहिती उघडत आहे…';
    const ud=await fdb.collection('users').doc(u.uid).get();
    if(!ud.exists) throw new Error('या लॉगिनशी कोणतीही ग्रामपंचायत जोडलेली नाही.');
    const d=ud.data();
    if(d.active===false) throw new Error('या लॉगिनचा प्रवेश बंद करण्यात आला आहे.');
    USER={uid:u.uid,role:d.role||'operator',name:d.name||d.username,gpId:d.gpId};
    GPID=d.gpId;
    const td=await fdb.collection('panchayats').doc(GPID).get();
    if(!td.exists) throw new Error('ग्रामपंचायत नोंद सापडली नाही.');
    TENANT=td.data();
    await loadAll();
    $('#gate').style.display='none'; $('#splash').style.display='none';
    $('#app').classList.add('on');
    renderNav(); go('dash');
    logAudit('प्रवेश','कार्यालय','');
    if(!licenceOk()) setTimeout(showExpired,600);
  }catch(e){
    $('#splash').style.display='none';
    await auth.signOut();
    $('#gate').style.display='grid'; showTab('login');
    $('#gateErr').textContent=e.message||'प्रवेश अयशस्वी.';
  }
}
async function logout(){ try{ await logAudit('बाहेर पडले','कार्यालय',''); }catch(e){} await auth.signOut(); }

function grabPhoto(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=function(e){const img=new Image();
    img.onload=function(){const max=820,s=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');cv.width=img.width*s;cv.height=img.height*s;
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      window._photo=cv.toDataURL('image/jpeg',0.62);
      $('#x_prev').innerHTML='<img class="thumb" style="width:76px;height:76px;margin-top:7px" src="'+window._photo+'" alt="">';};
    img.onerror=function(){toast('हे चित्र वाचता आले नाही.',true);};
    img.src=e.target.result;};
  r.readAsDataURL(f);
}
function grabGPS(){
  if(!navigator.geolocation) return toast('या उपकरणावर स्थान मिळत नाही.',true);
  $('#x_gps').textContent='स्थान घेत आहे…';
  navigator.geolocation.getCurrentPosition(
    function(p){window._gps={lat:p.coords.latitude.toFixed(6),lng:p.coords.longitude.toFixed(6)};
      $('#x_gps').textContent=window._gps.lat+', '+window._gps.lng;},
    function(){$('#x_gps').textContent='स्थान मिळाले नाही. खूण नोंदवा.';},
    {enableHighAccuracy:true,timeout:10000});
}

async function loadStaff(){
  try{
    const s=await fdb.collection('users').where('gpId','==',GPID).get();
    STAFF=s.docs.map(d=>Object.assign({uid:d.id},d.data()));
    if(page==='staff') $('#view').innerHTML=PAGES.staff.body();

}
function addStaff(){
  if(!guard('staff'))return;
  modal('नवीन वापरकर्ता · Add login','<div class="grid2">'+
    '<div class="field full"><label>नाव<span class="req">*</span></label><input id="u_name" class="mr"></div>'+
    '<div class="field"><label>पद<span class="req">*</span></label><select id="u_role">'+
      Object.keys(ROLES).map(k=>'<option value="'+k+'">'+ROLES[k].mr+'</option>').join('')+'</select></div>'+
    '<div class="field"><label>वापरकर्ता नाव<span class="req">*</span></label><input id="u_user" placeholder="gp_clerk1"></div>'+
    '<div class="field full"><label>पासवर्ड<span class="req">*</span></label><input type="password" id="u_pass"></div></div>',
    '<button class="btn ghost" onclick="closeModal()">रद्द</button><button class="btn" onclick="saveStaff()">तयार करा</button>');
}
async function saveStaff(){
  const name=val('u_name'),role=val('u_role'),user=val('u_user'),pass=$('#u_pass').value;
  if(!name){flagBad('u_name');return toast('नाव आवश्यक.',true);}
  if(!/^[a-zA-Z0-9_.-]{4,}$/.test(user)){flagBad('u_user');return toast('वापरकर्ता नाव किमान ४ इंग्रजी अक्षरे.',true);}
  if(pass.length<6){flagBad('u_pass');return toast('पासवर्ड किमान ६ अक्षरे.',true);}
  try{
    let sec=null;
    firebase.apps.forEach(function(a){ if(a.name==='sec') sec=a; });
    if(!sec) sec=firebase.initializeApp(FIREBASE_CONFIG,'sec');
    const cred=await sec.auth().createUserWithEmailAndPassword(emailFor(user),pass);
    await fdb.collection('users').doc(cred.user.uid).set({
      gpId:GPID,role:role,name:name,username:user,active:true,createdAt:FV.serverTimestamp()});
    await sec.auth().signOut();
    logAudit('वापरकर्ता तयार','व्यवस्थापन',name+' ('+user+')');
    closeModal(); loadStaff(); toast('वापरकर्ता तयार झाला.');
  }catch(e){
    toast(e.code==='auth/email-already-in-use'?'हे वापरकर्ता नाव आधीच वापरात आहे.':'तयार झाले नाही — '+(e.message||''),true);
  }
}
async function toggleStaff(uid2,active){
  if(!guard('staff'))return;
  try{
    await fdb.collection('users').doc(uid2).update({active:!active});
    logAudit(active?'प्रवेश बंद':'प्रवेश सुरू','व्यवस्थापन',uid2);
    loadStaff(); toast('बदल जतन झाला.');
  }catch(e){ toast('बदल झाला नाही.',true); }
}

function printReports(){
  const rows=wards().map(function(w){
    const props=DB.properties.filter(p=>p.ward===w);
    const dem=sum(props,p=>demandFor(p).total);
    const col=sum(DB.receipts.filter(r=>r.fy===TENANT.fy&&props.some(p=>p.id===r.propId)),r=>r.total);
    return '<tr><td class="num">'+esc(w)+'</td><td class="num">'+DB.citizens.filter(c=>c.ward===w).length+'</td>'+
      '<td class="num">'+props.length+'</td><td class="num">'+inr(dem)+'</td><td class="num">'+inr(col)+'</td>'+
      '<td class="num">'+inr(dem-col)+'</td><td class="num">'+(dem?Math.round(col/dem*100):0)+'%</td></tr>';}).join('');
  const dem=sum(DB.properties,p=>demandFor(p).total),col=sum(DB.receipts.filter(r=>r.fy===TENANT.fy),r=>r.total);
  doPrint(letterhead('Annual Summary Report')+
    '<h3>प्रभागनिहाय मागणी व वसुली अहवाल<small>Ward-wise Demand and Collection · FY '+esc(TENANT.fy)+'</small></h3><div class="rule"></div>'+
    '<table><tr><th>प्रभाग</th><th>नागरिक</th><th>मालमत्ता</th><th>मागणी</th><th>वसुली</th><th>थकबाकी</th><th>वसुली %</th></tr>'+
      rows+'<tr><td colspan="3"><strong>एकूण / Total</strong></td><td class="num"><strong>'+inr(dem)+'</strong></td>'+
      '<td class="num"><strong>'+inr(col)+'</strong></td><td class="num"><strong>'+inr(dem-col)+'</strong></td>'+
      '<td class="num"><strong>'+(dem?Math.round(col/dem*100):0)+'%</strong></td></tr></table>'+
    signBlock({n:TENANT.sarpanch||'सरपंच',t:'सरपंच · Sarpanch'},{n:TENANT.gramsevak||'ग्रामसेवक',t:'ग्रामसेवक · Gram Sevak'})+
    docFoot('संगणकीकृत अहवाल · Computer-generated report'));
}

function printRegister(id){
  const d=REGDEFS[id];if(!d)return;
  const rows=d.r();
  if(!rows.length) return toast('नोंदवही रिकामी आहे.',true);
  doPrint(letterhead('Register Extract')+
    '<h3>'+d.t+'<small>FY '+esc(TENANT.fy)+' · '+rows.length+' entries</small></h3><div class="rule"></div>'+
    '<table><tr>'+d.h.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>'+
      rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c==null?'':c)+'</td>').join('')+'</tr>').join('')+'</table>'+
    signBlock({n:TENANT.sarpanch||'सरपंच',t:'सरपंच · Sarpanch'},{n:TENANT.gramsevak||'ग्रामसेवक',t:'ग्रामसेवक · Gram Sevak'})+
    docFoot('संगणकीकृत नोंदवही उतारा'),true);
}
function exportCSV(id){
  const d=REGDEFS[id];if(!d)return;
  const rows=d.r();
  if(!rows.length) return toast('नोंदवही रिकामी आहे.',true);
  const Q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const csv='﻿'+[d.h.map(Q).join(',')].concat(rows.map(r=>r.map(Q).join(','))).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=id+'-'+TENANT.fy+'-'+today()+'.csv';a.click();URL.revokeObjectURL(a.href);
  toast('CSV फाइल डाउनलोड झाली.');
}
function exportData(){
  const ed=expiryDate();
  const payload={gpId:GPID,gp:Object.assign({},TENANT,{expiresAt:ed?ed.toISOString():null}),
    exportedAt:new Date().toISOString(),data:DB};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));
  a.download='gp-backup-'+GPID+'-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);
  toast('बॅकअप फाइल डाउनलोड झाली.');
}

async function saveSettings(){
  if(!guard('settings'))return;
  const patch={name:val('g_name')||TENANT.name,taluka:val('g_tal'),district:val('g_dist'),sarpanch:val('g_sar'),
    gramsevak:val('g_gs'),fy:val('g_fy')||TENANT.fy,code:val('g_code'),
    wards:val('g_wards').split(',').map(s=>s.trim()).filter(Boolean)};
  if(!patch.wards.length) patch.wards=['1'];
  try{
    await gpRef().update(patch);
    TENANT=Object.assign(TENANT,patch);
    logAudit('तपशील बदल','कार्यालय','');
    closeModal();renderNav();render();toast('तपशील जतन झाला.');
  }catch(e){ toast('जतन झाले नाही.',true); }
}
async function del(coll,id){
  if(!guard('delete'))return;
  if(!confirm('ही नोंद कायमची पुसायची?'))return;
  if(coll==='complaints'){
    try{ await gpRef().collection('complaints').doc(id).delete(); }
    catch(e){ return toast('पुसता आले नाही.',true); }
    DB.complaints=DB.complaints.filter(x=>x.id!==id);
    logAudit('नोंद पुसली',coll,id);renderBody();return toast('नोंद पुसली.');
  }
  DB[coll]=DB[coll].filter(x=>x.id!==id);
  if(await saveModule(coll)){logAudit('नोंद पुसली',coll,id);renderBody();toast('नोंद पुसली.');}
}
